name: Gerar APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Instalar Flet
        run: pip install flet
      - name: Build APK
        run: |
          mv empresa.py main.py
          echo "y" | flet build apk --verbose
      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-empresa
          path: build/apk
